<main class="main">
  <div class="summary">
    <span class="year-label">Year: {{ selectedYear }}</span>
    <span class="total-carbon">
      Total Global Carbon Footprint:
      <span class="total-value">{{ totalCarbon | number : "1.1-1" }} gha</span>
    </span>
  </div>

  <label class="chart-title">Countries:</label>

  @for (item of emissionsByCountry; track item.country) {
  <div class="bar-row">
    <span class="label">{{ item.country }}</span>
    <div class="bar-wrapper">
      <div class="bar" [style.width.%]="item.carbon * 10"></div>
      <span class="value">{{ item.carbon | number : "1.1-1" }} gha</span>
    </div>
  </div>
  }
</main>

<router-outlet />
